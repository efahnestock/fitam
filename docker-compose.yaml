services:
  fitam:
    build: 
      context: .
    volumes:
      - .:/fitam
      - ~/.ssh:/home/developer/.ssh:ro
    stdin_open: true
    tty: true
    working_dir: /fitam
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LOCAL_UID=${UID:-1000}
      - LOCAL_GID=${GID:-1000}

  notebook:
    build: 
      context: .
    volumes:
      - .:/fitam
      - ~/.ssh:/home/developer/.ssh:ro
    stdin_open: true
    tty: true
    working_dir: /fitam
    runtime: nvidia
    ports:
      - "8888:8888"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - JUPYTER_TOKEN=${TOKEN}
      - LOCAL_UID=${UID:-1000}
      - LOCAL_GID=${GID:-1000}
    command: ["jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--notebook-dir=/fitam"]
